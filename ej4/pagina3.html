<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Simulador de sorteos</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #edf7f0;
                text-align: center;
                padding: 35px;
            }

            #sorteo {
                background-color: white;
                max-width: 600px;
                margin: auto;
                padding: 30px;
                border-radius: 15px;
                box-shadow: 0 4px 12px #aaa;
            }

            h1 {
                color: #217346;
            }

            textarea {
                width: 90%;
                height: 150px;
                padding: 10px;
                font-family: Arial, sans-serif;
                font-size: 15px;
                border-radius: 8px;
                border: 1px solid #aaa;
                box-sizing: border-box;
            }

            input {
                width: 80px;
                padding: 8px;
                margin: 10px;
                border-radius: 5px;
                border: 1px solid #aaa;
            }

            button {
                padding: 12px 25px;
                background-color: #217346;
                color: white;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-size: 16px;
            }

            button:hover {
                background-color: #16532f;
            }

            #resultados {
                margin-top: 25px;
            }

            .ganador {
                background-color: #d8f5df;
                padding: 12px;
                margin: 10px auto;
                max-width: 300px;
                border-radius: 8px;
                font-weight: bold;
            }

            #mensaje {
                color: #b00020;
                font-weight: bold;
            }
        </style>
    </head>

    <body>

        <div id="sorteo">
            <h1>Simulador de sorteos</h1>

            <p>Introduce los participantes, uno por línea:</p>

            <textarea id="participantes" placeholder="Ana&#10;Carlos&#10;Lucía&#10;Pedro&#10;María">Ana
Carlos
Lucía
Pedro
María</textarea>

            <p>
                <label for="cantidad">Número de ganadores:</label>
                <input type="number" id="cantidad" min="1" value="2">
            </p>

            <button onclick="realizarSorteo()">Realizar sorteo</button>

            <p id="mensaje" aria-live="polite"></p>

            <div id="resultados" aria-live="polite"></div>

            <p>
                Fuente del snippet:
                <a href="https://css-tricks.com/snippets/javascript/shuffle-array/">
                    CSS-Tricks - Shuffle Array
                </a>
            </p>
        </div>

        <script>
            // Mezcla aleatoriamente los elementos de un array.
            // Adaptación del snippet "Shuffle Array" de CSS-Tricks.
            function mezclarArray(array) {
                let indiceActual = array.length;

                while (indiceActual !== 0) {
                    const indiceAleatorio =
                            Math.floor(Math.random() * indiceActual);

                    indiceActual--;

                    // Intercambiamos dos posiciones del array.
                    const temporal = array[indiceActual];
                    array[indiceActual] = array[indiceAleatorio];
                    array[indiceAleatorio] = temporal;
                }

                return array;
            }

            // Realiza el sorteo con los datos introducidos.
            function realizarSorteo() {
                const texto =
                        document.getElementById("participantes").value;

                const cantidad =
                        Number(document.getElementById("cantidad").value);

                const mensaje = document.getElementById("mensaje");
                const resultados = document.getElementById("resultados");

                mensaje.textContent = "";
                resultados.innerHTML = "";

                // Convertimos las líneas de texto en un array.
                const nombres = texto.split("\n")
                        .map(function (nombre) {
                            return nombre.trim();
                        })
                        .filter(function (nombre) {
                            return nombre !== "";
                        });

                // Eliminamos participantes repetidos.
                const participantes = [...new Set(nombres)];

                // Comprobamos que se han introducido participantes.
                if (participantes.length === 0) {
                    mensaje.textContent =
                            "Debes introducir al menos un participante.";
                    return;
                }

                // Comprobamos el número de ganadores.
                if (!Number.isInteger(cantidad) ||
                        cantidad < 1 ||
                        cantidad > participantes.length) {

                    mensaje.textContent =
                            "Introduce un número de ganadores entre 1 y " +
                            participantes.length + ".";
                    return;
                }

                // Mezclamos la lista de participantes.
                const mezclados = mezclarArray([...participantes]);

                // Seleccionamos los primeros nombres como ganadores.
                const ganadores = mezclados.slice(0, cantidad);

                const titulo = document.createElement("h2");
                titulo.textContent = "¡Ganadores del sorteo!";
                resultados.appendChild(titulo);

                // Mostramos los ganadores.
                ganadores.forEach(function (nombre, indice) {
                    const elemento = document.createElement("div");
                    elemento.className = "ganador";
                    elemento.textContent =
                            (indice + 1) + ". " + nombre;

                    resultados.appendChild(elemento);
                });

                const resumen = document.createElement("p");
                resumen.textContent =
                        "Participantes: " + participantes.length +
                        " | Ganadores: " + ganadores.length;

                resultados.appendChild(resumen);
            }
        </script>

    </body>
</html>
